<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  .wrap {
    width: 1024px; height: 500px; position: relative;
    background: radial-gradient(1200px 700px at 78% 42%, #14335c 0%, #0d2murmur 40%, #0a1a30 72%, #070f1c 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eaf1fb;
  }
  /* fallback for the typo-safe gradient */
  .wrap { background: radial-gradient(1200px 700px at 78% 42%, #16386a 0%, #0e2444 42%, #0a1a30 72%, #070f1c 100%); }
  .stars i {
    position: absolute; background: #cdddf3; border-radius: 50%; opacity: .5;
  }
  .copy { position: absolute; left: 84px; top: 150px; }
  .brand { font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .dot { color: #6ea8ff; }
  .tag { margin-top: 22px; font-size: 30px; font-weight: 500; color: #b9cbe6; max-width: 560px; line-height: 1.3; }
  .sub { margin-top: 16px; font-size: 19px; color: #7f95b5; }
  .orb {
    position: absolute; right: 120px; top: 50%; transform: translateY(-50%);
    width: 210px; height: 210px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #ffffff 0%, #eaf2ff 32%, #b9d2f5 60%, #6f9fe0 100%);
    box-shadow: 0 0 90px 30px rgba(150,190,255,.45), 0 0 200px 80px rgba(90,140,220,.25);
  }
  .cloud {
    position: absolute; right: 90px; bottom: 96px; width: 250px; height: 44px;
    background: rgba(180,205,240,.16); border-radius: 40px; filter: blur(3px);
  }
  .cloud.two { right: 175px; bottom: 150px; width: 150px; height: 30px; opacity: .7; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stars">
      <i style="left:70px;top:60px;width:3px;height:3px"></i>
      <i style="left:300px;top:40px;width:2px;height:2px"></i>
      <i style="left:520px;top:90px;width:3px;height:3px"></i>
      <i style="left:180px;top:120px;width:2px;height:2px"></i>
      <i style="left:640px;top:60px;width:2px;height:2px"></i>
      <i style="left:410px;top:150px;width:2px;height:2px"></i>
    </div>
    <div class="orb"></div>
    <div class="cloud"></div>
    <div class="cloud two"></div>
    <div class="copy">
      <div class="brand">Root<span class="dot">.</span></div>
      <div class="tag">Catch the moment. Live it, don't scroll it.</div>
      <div class="sub">A gentle friend for your screen-time, sleep, food and focus.</div>
    </div>
  </div>
</body>
</html>
